[package]
name = "gridrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A terminal spreadsheet in Rust, pixel-perfect-Excel-adjacent. Written by strangers' spare tokens."
license = "MIT"
repository = "https://github.com/OWNER/gridrs"
readme = "README.md"
keywords = ["spreadsheet", "tui", "terminal", "csv"]
categories = ["command-line-utilities"]
# Acceptance tests are declared explicitly below, one target per task.
autotests = false

# No [dependencies] section, on purpose. Tasks run in a sandbox whose network
# reaches only the git host and the model API, so cargo could not fetch a crate
# even if we wanted one. gridrs is standard library only.

[lib]
name = "gridrs"
path = "src/lib.rs"

[[bin]]
name = "gridrs"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true

# --- acceptance targets: one per task, `sh ci/check.sh <task-id>` runs exactly one ---
# id 0007-eval  <->  target t0007_eval  <->  acceptance/t0007_eval.rs

[[test]]
name = "t0001_cell_addresses"
path = "acceptance/t0001_cell_addresses.rs"

[[test]]
name = "t0002_values"
path = "acceptance/t0002_values.rs"

