spec_version: 1
id: 0103-reference-rewriting
title: "Reference rewriting: precedents, copy translation, insert/delete adjustment"
prompt: |
  gridrs is a terminal spreadsheet written in Rust with the standard library
  only. It is built one small task at a time by different people's coding
  agents; this is task 0103-reference-rewriting. The skeleton of the whole program already exists:
  every module is declared, every public function has its final signature and a
  doc comment, and the bodies are stubs. Your job is to replace the stubs named
  below with a real implementation. You cannot ask questions: everything you
  need is in this text, in the repository, and in the acceptance test.

  Implement the three functions in `src/formula/refs.rs` that find and rewrite
  the cell references inside a parsed formula. They are pure functions over the
  `Expr` tree (src/types.rs; do not change it); you do not need the parser, and
  the acceptance test builds its trees by hand.

  Relevant shapes: `Expr::Ref(Reference)` is one cell; `Expr::Range(a, b)` is a
  range whose two endpoint `Reference`s are stored AS WRITTEN (the first may be
  below or to the right of the second: `B7:A1`). `Reference { cell: CellRef
  { row, col }, abs_col, abs_row }` has zero-based coordinates. The sheet has
  `MAX_COLS` columns and `MAX_ROWS` rows. All three functions recurse into
  `Unary`, `Binary` and `Call` arguments and return every other node unchanged.

    pub fn precedents(expr: &Expr) -> Vec<Range>
      Every cell or range the expression reads, in source order (depth-first,
      left to right), duplicates kept. A `Ref` yields `Range::single(cell)`; a
      `Range(a, b)` yields `Range::new(a.cell, b.cell)` (normalised). `$` flags
      are irrelevant here.

    pub fn translate(expr: &Expr, dcol: i64, drow: i64) -> Expr
      The formula as it must read after being copied `dcol` columns to the
      right and `drow` rows down (negative = left / up). In each reference the
      column moves by `dcol` unless `abs_col`, the row moves by `drow` unless
      `abs_row`; the flags themselves are kept.
      - If a moved coordinate leaves the sheet (< 0, col >= MAX_COLS,
        row >= MAX_ROWS), that `Ref` node is replaced by
        `Expr::Error(ErrorKind::Ref)`.
      - For a `Range`, translate both endpoints independently and keep them in
        the order written; if EITHER leaves the sheet, the whole `Range` node is
        replaced by `Expr::Error(ErrorKind::Ref)`.
      - Only the broken node is replaced, never the surrounding formula:
        `A1+F6` moved by (-1, -1) is `#REF!+E5`.
      - Offsets can be anything, including i64::MIN and i64::MAX. No overflow,
        no panic.

    pub fn adjust(expr: &Expr, edit: StructuralEdit) -> Expr
      The formula as it must read after rows or columns were inserted or
      deleted, so that it still points at the same data. `$` makes no
      difference here: absolute and relative references are adjusted alike,
      and each endpoint keeps its own flags. A row edit only ever changes
      rows, a column edit only columns. Described for rows (columns are the
      same with the roles swapped); `at` is a zero-based index:

      InsertRows { at, count }: `count` new rows appear before row index `at`.
        - A coordinate `row >= at` becomes `row + count`; rows above are unchanged.
        - Single `Ref`: if the new row is >= MAX_ROWS the node becomes
          `Expr::Error(ErrorKind::Ref)`.
        - `Range`: move each endpoint by the same rule (so a range that
          straddles `at` grows); if either endpoint ends up >= MAX_ROWS the
          whole node becomes `#REF!`.

      DeleteRows { at, count }: rows `at .. at+count` (exclusive end) disappear.
        - Single `Ref`: a row inside the deleted span makes the node
          `Expr::Error(ErrorKind::Ref)`; a row at or beyond `at+count` moves up
          by `count`; rows above `at` are unchanged.
        - `Range`: ranges shrink instead of breaking. Let lo/hi be the smaller
          and larger of the two endpoint rows (if they are equal, the first
          endpoint is lo).
            * If lo and hi are BOTH inside the deleted span, nothing of the
              range survives: the node becomes `#REF!`.
            * Otherwise  new_lo = lo            if lo < at
                                 = at            if lo is inside the span (the first surviving row slides up to `at`)
                                 = lo - count    if lo >= at + count
                         new_hi = hi            if hi < at
                                 = at - 1        if hi is inside the span (the last surviving row)
                                 = hi - count    if hi >= at + count
              and each endpoint gets its new row back: whichever endpoint held
              lo gets new_lo, the other gets new_hi. Columns and flags are
              untouched. (So `A10:A1` stays "backwards".)

      `count == 0` changes nothing. `at` and `count` can be anything up to
      u32::MAX: compute in u64/i64 or with saturating arithmetic; no overflow,
      no panic.

  Examples (rows shown 1-based as a user sees them):
    SUM(A1:A5), InsertRows{at:2,count:2}   -> SUM(A1:A7)
    SUM(B2:B4)+C3, DeleteRows{at:2,count:1} -> SUM(B2:B3)+#REF!
    A3:A10, DeleteRows{at:1,count:3}        -> A2:A7
    A3:A5,  DeleteRows{at:2,count:3}        -> #REF!

  Rules
    - You may change ONLY the file `src/formula/refs.rs`, plus the marker file ci/done/0103-reference-rewriting
      (see below). A change to any other file - including Cargo.toml,
      Cargo.lock, src/types.rs, src/lib.rs, any mod.rs, and anything under
      acceptance/ or ci/ other than your marker - makes the whole run be
      discarded.
    - Standard library only: no new dependencies. There is no network access;
      always pass `--offline` to cargo.
    - Do not change the name, parameters or return type of any existing `pub`
      item in your file(s): other tasks and the acceptance test compile against
      them. You may add private helpers, and unit tests in a
      `#[cfg(test)] mod tests` at the bottom of your file(s).
    - No `unsafe`. No panics on any input: nothing that can fail on user data
      (`unwrap`, unchecked indexing, overflowing arithmetic). No `todo!()` left
      behind.
    - Delete the `#![allow(unused_variables)]` line at the top of each stub you
      implement and reword its "Stub: ..." doc line. The code should compile
      without warnings.

  Finishing
    1. Create the empty marker file for this task:   : > ci/done/0103-reference-rewriting
    2. Run the check that will judge your work:      sh ci/check.sh 0103-reference-rewriting
       It builds the crate, runs the unit tests, runs the acceptance test
       acceptance/t0103_reference_rewriting.rs (which you can read but must not change) and
       re-runs the acceptance test of every task merged before yours. It must
       end with "check.sh: OK". While iterating, run just your own test with
       `cargo test --offline --test t0103_reference_rewriting`.
    If the acceptance test and this text ever seem to disagree, the acceptance
    test wins: make it pass without touching it.
scope:
  write:
    - src/formula/refs.rs
    - ci/done/0103-reference-rewriting
verify: sh ci/check.sh 0103-reference-rewriting
max_tokens: 2500000
timeout_minutes: 30
depends_on: []
