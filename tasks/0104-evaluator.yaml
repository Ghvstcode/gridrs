spec_version: 1
id: 0104-evaluator
title: Formula evaluator
prompt: |
  gridrs is a terminal spreadsheet written in Rust with the standard library
  only. It is built one small task at a time by different people's coding
  agents; this is task 0104-evaluator. The skeleton of the whole program already exists:
  every module is declared, every public function has its final signature and a
  doc comment, and the bodies are stubs. Your job is to replace the stubs named
  below with a real implementation. You cannot ask questions: everything you
  need is in this text, in the repository, and in the acceptance test.

  Implement the formula evaluator in `src/formula/eval.rs`:

    pub fn eval(expr: &Expr, ctx: &dyn Context) -> Value

  `Expr`, `Value`, `Arg`, `Grid`, `Context`, `ErrorKind`, `Range`,
  `MAX_RANGE_CELLS` are in src/types.rs (do not change them). `Context` gives
  you `ctx.cell(CellRef) -> Value` (the current value of a cell, `Value::Empty`
  if nothing is there) and `ctx.call(name, &[Arg]) -> Value` (run a function).
  Always call functions through `ctx.call`; never call `crate::funcs` directly
  (the acceptance test supplies its own functions through the context).

  Already implemented and merged, use them (crate::value):
    to_number(&Value) -> Result<f64, ErrorKind>     to_text(&Value) -> Result<String, ErrorKind>
    compare(&Value, &Value) -> std::cmp::Ordering

  Think of it as an inner evaluation that may yield `Value::Empty`, wrapped by
  `eval`, which turns a final `Value::Empty` into `Value::Number(0.0)` (in a
  spreadsheet `=Z99` on an empty sheet shows 0). `eval` itself never returns
  `Value::Empty`. Inner evaluation:

  Literals   Number/Text/Bool/Error -> the corresponding Value.

  Ref(r)     ctx.cell(r.cell), as is (possibly Empty, possibly an Error). The
             `$` flags mean nothing to evaluation.

  Range(..)  A range is only meaningful as a function argument (below).
             Anywhere else (the whole formula, an operand of an operator) it
             evaluates to Value::Error(ErrorKind::Value).

  Unary      Neg:     to_number of the operand, negated.
             Percent: to_number of the operand, divided by 100.
             Pos:     the operand unchanged, whatever it is (text stays text).
             An operand that is an Error, or cannot be coerced, yields that error.

  Binary     The LEFT operand is fully dealt with before the right one is
             looked at for errors: evaluate both operands; then
             - arithmetic (Add Sub Mul Div Pow): a = to_number(left)?, then
               b = to_number(right)?; the first failure is the result (so
               `#N/A + "x"` is #N/A, and `"x" + #N/A` is #VALUE!).
               Div with b == 0 is ErrorKind::Div0 (also 0/0). Pow is
               `a.powf(b)`. Any result that is not finite (infinity or NaN,
               e.g. 1e200*1e200, (-8)^0.5, 0^-1) is ErrorKind::Num.
             - Concat: to_text(left)? then to_text(right)?, joined -> Text.
             - comparisons (Eq Ne Lt Le Gt Ge): if left is an Error return it,
               else if right is an Error return it, else apply
               crate::value::compare to the two values (NO coercion: "1" = 1
               is FALSE) and return the Bool.

  Call(name, args)
             Build one `Arg` per argument, in order:
             - an argument that is syntactically an `Expr::Range(a, b)` becomes
               `Arg::Range(Grid)`: normalise with `Range::new(a.cell, b.cell)`,
               and fill `Grid { rows, cols, cells }` row-major with `ctx.cell`
               for every cell (`Range::cells()` iterates in that order). A
               one-cell range is still an `Arg::Range`.
               If the range has more than MAX_RANGE_CELLS cells
               (`Range::len()`), do not build anything and do not call the
               function: the whole call evaluates to ErrorKind::Num.
               Arguments are processed strictly left to right, so
               arguments before the oversized range have already been
               evaluated (including any nested calls they contain) and
               arguments after it never are.
             - any other argument is evaluated with the INNER evaluation and
               passed as `Arg::Value(v)`: a reference to an empty cell arrives
               as Value::Empty (not 0), and an argument that evaluates to an
               error is passed along as Value::Error. Do not propagate argument
               errors yourself; functions like IFERROR need to see them.
             Then return `ctx.call(name, &args)` (the name is already upper case).

  No panics, and no stack overflow on a left-deep tree of 500 binary operators.

  Rules
    - You may change ONLY the file `src/formula/eval.rs`, plus the marker file ci/done/0104-evaluator
      (see below). A change to any other file - including Cargo.toml,
      Cargo.lock, src/types.rs, src/lib.rs, any mod.rs, and anything under
      acceptance/ or ci/ other than your marker - makes the whole run be
      discarded.
    - Standard library only: no new dependencies. There is no network access;
      always pass `--offline` to cargo.
    - Do not change the name, parameters or return type of any existing `pub`
      item in your file(s): other tasks and the acceptance test compile against
      them. You may add private helpers, and unit tests in a
      `#[cfg(test)] mod tests` at the bottom of your file(s).
    - No `unsafe`. No panics on any input: nothing that can fail on user data
      (`unwrap`, unchecked indexing, overflowing arithmetic). No `todo!()` left
      behind.
    - Delete the `#![allow(unused_variables)]` line at the top of each stub you
      implement and reword its "Stub: ..." doc line. The code should compile
      without warnings.

  Finishing
    1. Create the empty marker file for this task:   : > ci/done/0104-evaluator
    2. Run the check that will judge your work:      sh ci/check.sh 0104-evaluator
       It builds the crate, runs the unit tests, runs the acceptance test
       acceptance/t0104_evaluator.rs (which you can read but must not change) and
       re-runs the acceptance test of every task merged before yours. It must
       end with "check.sh: OK". While iterating, run just your own test with
       `cargo test --offline --test t0104_evaluator`.
    If the acceptance test and this text ever seem to disagree, the acceptance
    test wins: make it pass without touching it.
scope:
  write:
    - src/formula/eval.rs
    - ci/done/0104-evaluator
verify: sh ci/check.sh 0104-evaluator
max_tokens: 2500000
timeout_minutes: 30
depends_on:
  - 0002-values
