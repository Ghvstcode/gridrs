spec_version: 1
id: 0403-sheet-ops
title: Copy/paste with reference shifting; insert/delete rows and columns
prompt: |
  gridrs is a terminal spreadsheet written in Rust with the standard library
  only. It is built one small task at a time by different people's coding
  agents; this is task 0403-sheet-ops. The skeleton of the whole program already exists:
  every module is declared, every public function has its final signature and a
  doc comment, and the bodies are stubs. Your job is to replace the stubs named
  below with a real implementation. You cannot ask questions: everything you
  need is in this text, in the repository, and in the acceptance test.

  Implement whole-sheet operations in `src/ops.rs`: copy, paste (with relative
  reference adjustment), and inserting/deleting rows and columns (with
  reference rewriting). They use only the public API of `Sheet`.

    pub fn copy(sheet: &Sheet, range: Range) -> Clip
    pub fn paste(sheet: &mut Sheet, clip: &Clip, dest: CellRef)
    pub fn apply_structural(sheet: &mut Sheet, edit: StructuralEdit)

  Already implemented and merged, use them:
    Sheet: cells() -> Vec<(CellRef, String)> (non-empty inputs, row-major),
           input(at), apply(&[(CellRef, String)]) (batch set, "" clears, one
           recalculation), format(at), set_format(at, f), formats() (non-General,
           row-major), col_width(col), set_col_width(col, w), col_widths()
           (non-default), used_range()
    crate::formula::parser::parse(&str) -> Result<Expr, FormulaError>   accepts the leading `=`
    crate::formula::print::to_string(&Expr) -> String                   canonical text, no `=`
    crate::formula::refs::translate(&Expr, dcol: i64, drow: i64) -> Expr
    crate::formula::refs::adjust(&Expr, StructuralEdit) -> Expr
  Types are in src/types.rs (do not change them): `Clip { origin, rows, cols,
  cells: Vec<ClipCell> }`, `ClipCell { drow, dcol, input, format }`,
  `StructuralEdit::{InsertRows, DeleteRows, InsertCols, DeleteCols} { at, count }`,
  MAX_ROWS, MAX_COLS.

  THE REWRITE RULE (used by paste and by structural edits)
    An input is a formula when it starts with `=` and is longer than one
    character. To rewrite a formula input with some tree transformation T:
      - if it does not parse, keep the input exactly as it is;
      - if T(tree) == tree, keep the input exactly as it is (the user's
        spacing and capitalisation survive when nothing moved);
      - otherwise the new input is "=" + print::to_string(&T(tree)).
    Inputs that are not formulas are never changed.

  copy
    `Clip { origin: range.start, rows: range.rows(), cols: range.cols(), cells }`
    where `cells` has one entry, in row-major order, for each cell of the range
    that has a non-empty input OR a non-General format: its offset from the
    origin (`drow`, `dcol`), its input (possibly "") and its format. Cells
    that are empty and General are not listed. Never iterate over every cell
    of the range (it may be the whole sheet): walk `sheet.cells()` and
    `sheet.formats()` and keep what falls inside.

  paste
    Overwrite the rectangle of `clip.rows` x `clip.cols` cells whose top-left
    corner is `dest`:
      - a destination cell that corresponds to a `ClipCell` gets that cell's
        format, and its input rewritten with
        T = translate(tree, dest.col - origin.col, dest.row - origin.row)
        (per THE REWRITE RULE; non-formulas verbatim);
      - a destination cell with no corresponding `ClipCell` is cleared: input
        "" and format General;
      - destination cells that would lie beyond the last row or column are
        skipped (the part that fits is still pasted).
    Read everything you need before writing (the destination may overlap the
    source: pasting A1:A3 one row down must work), then write all inputs with
    ONE `sheet.apply` call. Do not loop over an enormous empty destination
    rectangle cell by cell: clear only cells that currently have an input or a
    format.

  apply_structural
    Rows, described for InsertRows / DeleteRows (columns are symmetric):
      InsertRows { at, count }: every cell with row >= at moves down by
        `count`; cells that would land at row >= MAX_ROWS are dropped.
      DeleteRows { at, count }: cells in rows at .. at+count (exclusive) are
        removed; cells below move up by `count`.
    In both cases:
      - EVERY formula on the sheet, moved or not, is rewritten with
        T = adjust(tree, edit) per THE REWRITE RULE (the formula is rewritten
        for its content; where the cell itself ends up is decided by the rule
        above);
      - number formats move, and are dropped, together with their cells;
      - for column edits, column widths move with their columns (inserted
        columns have the default width, deleted columns lose theirs); row
        edits never touch widths;
      - `count == 0`, or `at` at or beyond the end of the sheet (at >= MAX_ROWS
        for rows, at >= MAX_COLS for columns), is a no-op that must leave every
        input byte-for-byte unchanged;
      - `count` may be as large as u32::MAX (deleting "everything from here
        down"); no overflow.
    Rebuild in one go: compute the new inputs/formats/widths from the old
    ones, then clear what is gone and write what is new with a single
    `sheet.apply` (so the sheet recalculates once), and set formats/widths.
    Afterwards `sheet.cells()`, `formats()` and `col_widths()` must contain
    exactly the moved entries and nothing stale.

  Examples
    C1 `=A1+B1` copied to C2 becomes `=A2+B2`; to D1, `=B1+C1`.
    `=$B$1+B$1+$B1+B1` copied two right, two down: `=$B$1+D$1+$B3+D3`.
    `=A1` copied one column to the left: `=#REF!`.
    Inserting 2 rows before row 3 turns `=SUM(B2:B4)` (wherever it is) into
    `=SUM(B2:B6)`; deleting row 3 turns it into `=SUM(B2:B3)` and `=$B$3` into
    `=#REF!`.

  Rules
    - You may change ONLY the file `src/ops.rs`, plus the marker file ci/done/0403-sheet-ops
      (see below). A change to any other file - including Cargo.toml,
      Cargo.lock, src/types.rs, src/lib.rs, any mod.rs, and anything under
      acceptance/ or ci/ other than your marker - makes the whole run be
      discarded.
    - Standard library only: no new dependencies. There is no network access;
      always pass `--offline` to cargo.
    - Do not change the name, parameters or return type of any existing `pub`
      item in your file(s): other tasks and the acceptance test compile against
      them. You may add private helpers, and unit tests in a
      `#[cfg(test)] mod tests` at the bottom of your file(s).
    - No `unsafe`. No panics on any input: nothing that can fail on user data
      (`unwrap`, unchecked indexing, overflowing arithmetic). No `todo!()` left
      behind.
    - Delete the `#![allow(unused_variables)]` line at the top of each stub you
      implement and reword its "Stub: ..." doc line. The code should compile
      without warnings.

  Finishing
    1. Create the empty marker file for this task:   : > ci/done/0403-sheet-ops
    2. Run the check that will judge your work:      sh ci/check.sh 0403-sheet-ops
       It builds the crate, runs the unit tests, runs the acceptance test
       acceptance/t0403_sheet_ops.rs (which you can read but must not change) and
       re-runs the acceptance test of every task merged before yours. It must
       end with "check.sh: OK". While iterating, run just your own test with
       `cargo test --offline --test t0403_sheet_ops`.
    If the acceptance test and this text ever seem to disagree, the acceptance
    test wins: make it pass without touching it.
scope:
  write:
    - src/ops.rs
    - ci/done/0403-sheet-ops
verify: sh ci/check.sh 0403-sheet-ops
max_tokens: 3500000
timeout_minutes: 40
depends_on:
  - 0102-formula-parser
  - 0103-reference-rewriting
  - 0402-sheet
