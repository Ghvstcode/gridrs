spec_version: 1
id: 0101-formula-lexer
title: "Formula lexer: text to tokens"
prompt: |
  gridrs is a terminal spreadsheet written in Rust with the standard library
  only. It is built one small task at a time by different people's coding
  agents; this is task 0101-formula-lexer. The skeleton of the whole program already exists:
  every module is declared, every public function has its final signature and a
  doc comment, and the bodies are stubs. Your job is to replace the stubs named
  below with a real implementation. You cannot ask questions: everything you
  need is in this text, in the repository, and in the acceptance test.

  Implement the formula lexer in `src/formula/lexer.rs`:

    pub fn tokenize(src: &str) -> Result<Vec<Token>, FormulaError>

  `Token`, `ErrorKind` and `FormulaError` are defined in src/types.rs (do not
  change them). `FormulaError::new("message")` builds an error; nothing matches
  on the message text, but make it useful to a human (say what was unexpected
  and where).

  Rules, applied left to right; at each position the first that matches wins:

  Whitespace: space, tab, `\n`, `\r` separate tokens and are otherwise skipped.
    No other character counts as whitespace (a no-break space is an error).

  Number -> Token::Number(f64). Grammar (ASCII digits only):
        digits [ "." [digits] ]   |   "." digits
    optionally followed by an exponent: (e|E) [+|-] digits.
    - A sign is NEVER part of a number: "-1" is [Minus, Number(1)].
    - The exponent is only taken when at least one digit follows (after the
      optional sign); otherwise the number ends before the `e` and lexing
      continues there: "2e" is [Number(2), Ident("e")], "2e+x" is
      [Number(2), Ident("e"), Plus, Ident("x")].
    - Greedy: "1.2.3" is [Number(1.2), Number(0.3)], "5." is [Number(5)],
      "3A" is [Number(3), Ident("A")].
    - A literal whose value is not finite ("1e999") is an error.

  String -> Token::Text(String). Starts and ends with `"`. Inside, `""` is one
    literal quote; every other character (including newlines and any Unicode)
    is taken as is. The token holds the unescaped content without the quotes.
    Reaching the end of input before the closing quote is an error.

  Identifier -> Token::Ident(String). Starts with an ASCII letter, `_` or `$`;
    continues with ASCII letters, ASCII digits, `_`, `.` or `$`. The text is
    kept EXACTLY as written (no case folding, `$` kept): "sum", "$A$1", "a$1",
    "_x.y_2", "TRUE". The lexer does not decide whether an identifier is a
    function, a cell or a boolean; the parser does.

  Error literal -> Token::Error(ErrorKind). A `#` must be followed by one of
    the seven spellings `#DIV/0!` `#REF!` `#NAME?` `#VALUE!` `#NUM!` `#N/A`
    `#CYCLE!` (see `ErrorKind::ALL` / `as_str()`), matched ASCII
    case-insensitively. A `#` followed by anything else ("#", "#REF", "#NOPE!")
    is an error.

  Operators and punctuation:
    `+` Plus   `-` Minus   `*` Star   `/` Slash   `^` Caret   `&` Amp   `%` Percent
    `=` Eq     `<>` Ne     `<=` Le    `<` Lt      `>=` Ge     `>` Gt
    `(` LParen `)` RParen  `,` Comma  `:` Colon
    Two-character operators win over one-character ones: "<=>" is [Le, Gt],
    "<>=" is [Ne, Eq], "><" is [Gt, Lt], "==" is [Eq, Eq].

  Anything else (`?`, `@`, `!`, `;`, `{`, `[`, `'`, `~`, `\`, any non-ASCII
  character outside a string, ...) is an error.

  Empty or all-whitespace input is `Ok(vec![])`. The function must never panic,
  whatever bytes it is given: mind char boundaries when slicing (`"é"` is two
  bytes).

  Rules
    - You may change ONLY the file `src/formula/lexer.rs`, plus the marker file ci/done/0101-formula-lexer
      (see below). A change to any other file - including Cargo.toml,
      Cargo.lock, src/types.rs, src/lib.rs, any mod.rs, and anything under
      acceptance/ or ci/ other than your marker - makes the whole run be
      discarded.
    - Standard library only: no new dependencies. There is no network access;
      always pass `--offline` to cargo.
    - Do not change the name, parameters or return type of any existing `pub`
      item in your file(s): other tasks and the acceptance test compile against
      them. You may add private helpers, and unit tests in a
      `#[cfg(test)] mod tests` at the bottom of your file(s).
    - No `unsafe`. No panics on any input: nothing that can fail on user data
      (`unwrap`, unchecked indexing, overflowing arithmetic). No `todo!()` left
      behind.
    - Delete the `#![allow(unused_variables)]` line at the top of each stub you
      implement and reword its "Stub: ..." doc line. The code should compile
      without warnings.

  Finishing
    1. Create the empty marker file for this task:   : > ci/done/0101-formula-lexer
    2. Run the check that will judge your work:      sh ci/check.sh 0101-formula-lexer
       It builds the crate, runs the unit tests, runs the acceptance test
       acceptance/t0101_formula_lexer.rs (which you can read but must not change) and
       re-runs the acceptance test of every task merged before yours. It must
       end with "check.sh: OK". While iterating, run just your own test with
       `cargo test --offline --test t0101_formula_lexer`.
    If the acceptance test and this text ever seem to disagree, the acceptance
    test wins: make it pass without touching it.
scope:
  write:
    - src/formula/lexer.rs
    - ci/done/0101-formula-lexer
verify: sh ci/check.sh 0101-formula-lexer
max_tokens: 2000000
timeout_minutes: 25
depends_on: []
